<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/style.css"></head><body>
<header class="top"><a class="btn" href="../index.html">&#9668; Back</a><span class="by">Mineclowter<small>by Hazik</small></span></header>
<main class="wrap"><h1 class="title"><img id="ic" width="48" height="48"><span id="tt"></span></h1><section class="card"><h3>Other game &rarr; Minecraft</h3><div class="row"><div><label>Game</label><select id="g"></select></div><div><label>Sensitivity</label><input id="s" type="number" value="1" step="any"></div><div><label>DPI</label><input id="d" type="number" value="800"></div></div><div class="res" id="o"></div>
<h3 style="margin-top:20px">Minecraft % &rarr; cm/360</h3><label>Minecraft sensitivity %</label><input id="m" type="number" value="100"><div class="res" id="o2"></div></section></main>
<script src="../assets/common.js"></script><script>
const Y={'CS2 / CSGO':.022,'Valorant':.07,'Overwatch 2':.0066,'Apex Legends':.022};
$('#g').innerHTML=Object.keys(Y).map(k=>'<option>'+k).join('');
const deg=p=>1.2*(p*.6+.2)**3;
function c(){const cm=360/(Y[$('#g').value]*v('s')*v('d')/2.54),dg=360*2.54/(cm*v('d'));
let p=((dg/1.2)**(1/3)-.2)/.6;p=Math.min(1,Math.max(0,p));
out('o',`cm/360: <b>${cm.toFixed(1)}</b><br>Minecraft sens: <b>${Math.round(p*100)}%</b>`+(p>=1?' (capped - lower DPI or raise it)':''));
out('o2',`cm/360 at ${v('d')} DPI: <b>${(360*2.54/(deg(v('m')/100)*v('d'))).toFixed(1)}</b>`)}
$$('input,select').forEach(e=>e.oninput=c);c();</script></body></html>
