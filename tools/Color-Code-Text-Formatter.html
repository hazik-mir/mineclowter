<header class="top"><a class="btn" href="../index.html">&#9668; Back</a><span class="by">Mineclowter<small>by Hazik</small></span></header>
<main class="wrap"><h1 class="title"><img id="ic" width="48" height="48"><span id="tt"></span></h1><section class="card"><label>Text (use &amp; codes)</label><textarea id="t" rows="3">&6&lMineclowter &r&aby &nHazik</textarea><p id="p"></p><div id="b"></div><div class="res" id="o"></div><button onclick="copy($('#o').textContent)">Copy with &sect;</button></section></main>
<script src="../assets/common.js"></script><script>
const CL='0 #000,1 #0000aa,2 #00aa00,3 #00aaaa,4 #aa0000,5 #aa00aa,6 #ffaa00,7 #aaaaaa,8 #555555,9 #5555ff,a #55ff55,b #55ffff,c #ff5555,d #ff55ff,e #ffff55,f #ffffff'.split(',').map(x=>x.split(' '));
$('#b').innerHTML=CL.map(c=>`<button style="background:${c[1]};color:${c[0]=='0'||c[0]=='1'?'#fff':'#000'};text-shadow:none" onclick="ins('&${c[0]}')">&${c[0]}</button>`).join('')+['l bold','o italic','n underline','m strike','k magic','r reset'].map(x=>`<button onclick="ins('&${x[0]}')">&${x[0]} ${x.slice(2)}</button>`).join('');
function ins(c){const t=$('#t');t.value+=c;u()}
function u(){const parts=$('#t').value.split(/[&§]([0-9a-fk-or])/);let col='#fff',st=[],h='';
for(let i=0;i<parts.length;i++){if(i%2==0){h+=`<span style="color:${col};${st.includes('l')?'font-weight:bold;':''}${st.includes('o')?'font-style:italic;':''}text-decoration:${(st.includes('n')?'underline ':'')+(st.includes('m')?'line-through':'')};${st.includes('k')?'filter:blur(1px)':''}">${parts[i].replace(/</g,'&lt;')}</span>`}
else{const c=parts[i];if(c=='r'){col='#fff';st=[]}else if(/[0-9a-f]/.test(c)){col=CL.find(x=>x[0]==c)[1];st=[]}else st.push(c)}}
$('#p').innerHTML=h;$('#p').style.cssText='background:#222;padding:12px;border:3px solid #000;font-size:16px';$('#o').textContent=$('#t').value.replace(/&([0-9a-fk-or])/g,'§$1')}
$('#t').oninput=u;u();</script></body></html>
