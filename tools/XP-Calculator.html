<header class="top"><a class="btn" href="../index.html">&#9668; Back</a><span class="by">Mineclowter<small>by Hazik</small></span></header>
<main class="wrap"><h1 class="title"><img id="ic" width="48" height="48"><span id="tt"></span></h1><section class="card"><div class="row"><div><label>Current level</label><input id="a" type="number" value="0"></div><div><label>Target level</label><input id="b" type="number" value="30"></div></div><div class="res" id="o"></div></section></main>
<script src="../assets/common.js"></script><script>
const tot=L=>L<=16?L*L+6*L:L<=31?2.5*L*L-40.5*L+360:4.5*L*L-162.5*L+2220;
const per=L=>L<=15?2*L+7:L<=30?5*L-38:9*L-158;
function c(){const a=v('a'),b=v('b');out('o',`XP points needed: <b>${Math.round(tot(b)-tot(a))}</b><br>Total XP at level ${a}: ${Math.round(tot(a))}<br>Total XP at level ${b}: ${Math.round(tot(b))}<br>XP to go ${b}&rarr;${b+1}: ${per(b)}<br>Bottles o' Enchanting (avg 7 XP): ~${Math.ceil(Math.max(0,tot(b)-tot(a))/7)}`)}
$$('input').forEach(e=>e.oninput=c);c();</script><script src="../assets/ads.js"></script></body></html>
