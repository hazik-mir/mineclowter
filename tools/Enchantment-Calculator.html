<header class="top"><a class="btn" href="../index.html">&#9668; Back</a><span class="by">Mineclowter<small>by Hazik</small></span></header>
<main class="wrap"><h1 class="title"><img id="ic" width="48" height="48"><span id="tt"></span></h1><section class="card"><p>Anvil cost for combining an item with an enchanted book (Java).</p><div class="row"><div><label>Item prior-work uses</label><input id="a" type="number" value="0" min="0"></div><div><label>Book prior-work uses</label><input id="b" type="number" value="0" min="0"></div></div><div id="l"></div><div class="res" id="o"></div></section></main>
<script src="../assets/common.js"></script><script>
const E=[['Mending',1,2],['Unbreaking',3,1],['Efficiency',5,1],['Fortune',3,2],['Silk Touch',1,4],['Sharpness',5,1],['Looting',3,2],['Protection',4,1],['Thorns',3,4],['Sweeping Edge',3,2],['Power',5,1],['Infinity',1,4]];
$('#l').innerHTML=E.map((e,i)=>`<label>${e[0]} (0-${e[1]}, x${e[2]})</label><input type="number" id="e${i}" min="0" max="${e[1]}" value="0">`).join('');
function c(){let s=0;E.forEach((e,i)=>s+=Math.min(e[1],v('e'+i))*e[2]);const t=s+(2**v('a')-1)+(2**v('b')-1);
out('o',`Base enchant cost: ${s}<br>Total: <b>${t} levels</b> ${t>=40?'- <span style="color:#f55">Too Expensive!</span>':''}`)}
$$('input').forEach(e=>e.oninput=c);c();</script><script src="../assets/ads.js"></script></body></html>
