const C={give:[['Target','@p'],['Item','diamond_sword'],['Count','1']],summon:[['Entity','zombie'],['Position','~ ~ ~'],['NBT (optional)','{CustomName:\'"Boss"\'}']],effect:[['Target','@p'],['Effect','speed'],['Seconds','60'],['Level','1']],tp:[['Target','@p'],['Destination','0 100 0']],fill:[['From','~ ~ ~'],['To','~10 ~5 ~10'],['Block','stone'],['Mode','replace']],gamemode:[['Mode','creative'],['Target','@p']],enchant:[['Target','@p'],['Enchantment','sharpness'],['Level','5']]};
